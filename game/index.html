<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Laguna Brava</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #0d0a08; }
  #game { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
  /* Read aloud, never shown: the status line screen readers announce. */
  #status { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
</style>
</head>
<body>
<canvas id="game" aria-label="Laguna Brava: an open-world crime game of stilt villages, airboat channels and storm-season smuggling. Move with W A S D, enter vehicles and talk with E, shoot with F or the mouse, open the full map with M, pause and stats with P."></canvas>
<p id="status" role="status" aria-live="polite"></p>
<script type="module" src="./src/main.js"></script>
</body>
</html>
